name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ./solution-2-nextjs
        run: npm install

      - name: Run linter
        working-directory: ./solution-2-nextjs
        run: npm run lint

      - name: Run unit test suite
        working-directory: ./solution-2-nextjs
        run: npm test

      - name: Build Next.js application
        working-directory: ./solution-2-nextjs
        run: npm run build
